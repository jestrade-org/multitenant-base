# Internal only — reached through the edge nginx in deploy/staging, which terminates TLS
# and proxies /api and /auth/v1 elsewhere. This container serves only the built SPA.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location / {
    # Client-side routing (react-router): any path that isn't a real static file falls
    # back to index.html so a deep link or a refresh doesn't 404.
    try_files $uri /index.html;
  }

  # Hashed filenames from the Vite build are safe to cache indefinitely.
  location ~* "\.[0-9a-f]{8,}\.(js|css|svg|png|jpg|jpeg|woff2?)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
