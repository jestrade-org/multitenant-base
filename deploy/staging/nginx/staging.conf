# Staging only. ADR 0002.
#
# nginx terminates TLS and is the only thing listening on the public interface. The site
# is open to anyone, and visitors authenticate through the app's own login; `limit_req`
# below and that login are what stand between an anonymous visitor and the box.

limit_req_zone $binary_remote_addr zone=staging_general:10m rate=20r/s;
# Login and refresh are the endpoints worth grinding at. Stricter, deliberately.
limit_req_zone $binary_remote_addr zone=staging_auth:10m rate=2r/s;

# Certbot's HTTP-01 challenge, and nothing else, may be served over plain HTTP.
server {
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  # Named hosts, not a wildcard: HTTP-01 issues these without a DNS API token. A demo
  # that provisions tenants live needs *.staging.example.test instead, which means DNS-01.
  server_name staging.example.test acme.staging.example.test;

  ssl_certificate     /etc/letsencrypt/live/staging.example.test/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staging.example.test/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;

  client_max_body_size 10m;

  # The application resolves the tenant from the Host header. Rewriting it here — which
  # `proxy_set_header Host $proxy_host` would do — makes every tenant-scoped route fail
  # with tenantNotResolved(). Pass the original through.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Security headers come from Helmet in the app. Setting them here too would mean two
  # sources of truth that drift apart.

  location /auth/v1/ {
    limit_req zone=staging_auth burst=5 nodelay;
    proxy_pass http://auth:9999/;
  }

  location /api/v1/auth/ {
    limit_req zone=staging_auth burst=5 nodelay;
    proxy_pass http://api:3000;
  }

  # The built SPA. Everything that isn't the API or the auth provider lands here,
  # including client-side routes, which the web container falls back to index.html for.
  location / {
    limit_req zone=staging_general burst=40 nodelay;
    proxy_pass http://web:80;
  }

  location /api/ {
    limit_req zone=staging_general burst=40 nodelay;
    proxy_pass http://api:3000;
  }

  location = /health/ready {
    proxy_pass http://api:3000;
  }
}
